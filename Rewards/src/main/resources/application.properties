spring.application.name=Rewards
server.port=7002

# ✅ Common Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

# ✅ Consumer for Integer (update transaction)
spring.kafka.consumer.integer.group-id=group-1
spring.kafka.consumer.integer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.integer.value-deserializer=org.apache.kafka.common.serialization.IntegerDeserializer

# ✅ Consumer for JSON (add transaction)
spring.kafka.consumer.json.group-id=group-2
spring.kafka.consumer.json.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.json.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer


